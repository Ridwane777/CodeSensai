[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensai"
version = "0.1.0"
description = "CodeSensai — local developer agent (Ollama, no LLM framework)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
    "puremagic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "docker>=7.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
sensai = "sensai.cli:main"
sensai-prompt = "sensai.prompt_cli:main"
sensai-schedule = "sensai.schedule_cli:main"
sensai-eval = "sensai.eval.cli:main"
sensai-web = "sensai.web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 100 columns: tool descriptions and comments are fairly verbose;
# 88 forced splitting sentences in two.
line-length = 100
# The root docker/ folder (Chromium image) is not the SDK's `docker` package.
src = ["src"]

[tool.ruff.lint]
# Explicit rule set: otherwise `ruff` in CI follows its defaults, which change
# between versions — CI would break on its own without any code change.
select = ["E", "F", "I", "UP", "B", "RUF"]
# UP042 suggests StrEnum: str() of a StrEnum returns the value, not "Risk.WRITE".
# That is a behavior change, to be done separately if needed, not as part of the 3.12 bump.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Outside the package: a prototype kept for reference (spike) and a frontend
# image-preparation script. Long lines allowed, everything else is checked.
"docs/design/web_facade_spike.py" = ["E501"]
"frontend/scripts/prepare_ai_frames.py" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "docker: runs real containers; skipped when no Docker daemon is reachable",
]
